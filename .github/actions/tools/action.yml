name: hwcheck tools
description: >-
  The tools hwcheck's test and score gate the boards with, as the Hive's own check has them
  (/hive/tools): hive-hwde at its current main in .ci/hive-hwde, uv, xvfb, and KiCad as an AppDir
  in $RUNNER_TEMP/tools, cached. Shared by ci.yml's test and score jobs (issue #127). It reads
  KICAD_VERSION, KICAD_APPIMAGE and HWDE_REPO from the workflow's env.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.HWDE_REPO }}
        path: .ci/hive-hwde
        persist-credentials: false
    - name: hive-hwde commit
      shell: bash
      run: echo "hive-hwde $(git -C .ci/hive-hwde rev-parse --short HEAD) ($(cat .ci/hive-hwde/VERSION 2>/dev/null))"
    - uses: astral-sh/setup-uv@v6
    - name: xvfb (KiCad's SWIG paths need a display)
      shell: bash
      run: sudo apt-get install -y xvfb
    - uses: actions/cache@v4
      id: kicad
      with:
        path: ${{ runner.temp }}/tools/kicad-${{ env.KICAD_VERSION }}
        # v2: the first key cached an empty folder (220 B), so every run that gated a board
        # found no kicad-cli (PR #96, 10-30).
        key: kicad-v2-${{ env.KICAD_APPIMAGE }}
    - name: KiCad ${{ env.KICAD_VERSION }} as an AppDir
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
        dir="kicad-$KICAD_VERSION"
        # A restored cache counts only if it holds a KiCad that runs; else fetch it again.
        if [ ! -x "$dir/AppRun" ]; then
          rm -rf "$dir" squashfs-root AppDir
          curl -fsSL -o kicad.AppImage "$KICAD_APPIMAGE"
          chmod +x kicad.AppImage
          ./kicad.AppImage --appimage-extract >/dev/null
          # The AppImage's runtime extracts to squashfs-root or AppDir, by its version.
          if [ -d squashfs-root ]; then mv squashfs-root "$dir"; else mv AppDir "$dir"; fi
          rm kicad.AppImage
        fi
        ls -la "$dir" | head -20
        du -sh "$dir"
        test -x "$dir/AppRun"
        xvfb-run -a "$dir/AppRun" kicad-cli version
