name: ci
# The project's test (.hive/project.json's "test") on GitHub's standard hosted runner, so the
# Hive runs none of it on its own machine (forge_tests in .hive/project.json). Standard runners
# only, on the person's word (10-29 13:37): a public repo's are free with no minute cap.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # A PR's superseded run is cancelled; every push to main gets a group of its own (keyed by
  # its commit), so none is left pending behind another.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # The tools the Hive's own check uses (/hive/tools): KiCad 10.0.6 as an AppDir, and hive-hwde
  # at its current main, from their public repositories. hwde isn't pinned: /hive/tools/hwde
  # follows the installed module (hive-hwde e8751a80), so CI gates the boards with the same
  # current hwde rather than an old commit (issue #107; it was aa1ec48).
  KICAD_VERSION: 10.0.6
  KICAD_APPIMAGE: https://github.com/pkgforge-dev/KiCad-AppImage/releases/download/10.0.6-2%402026-10-01_1790876568/KiCad-10.0.6-2-anylinux-x86_64.AppImage
  HWDE_REPO: Hive-RSI-Lab/hive-hwde
jobs:
  # The Hive reads this job's check as "test (ubuntu-latest)"; keep it unnamed.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The test gates the boards changed since its merge base with origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/tools
      - name: the test (python3 tools/hwcheck.py test)
        shell: bash
        run: |
          set -o pipefail
          python3 tools/hwcheck.py test 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          HIVE_TOOLS: ${{ runner.temp }}/tools
          HWDE_BIN: ${{ github.workspace }}/.ci/hive-hwde/bin/hwde
          HWDE_HOME: ${{ runner.temp }}/hwde
      # Job logs need a login; annotations don't, so the Hive can read what failed.
      - name: name the failing tests
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/test.log" ] || exit 0
          grep -n -e '^FAIL' -e '^ERROR:' -e ': FAIL' "$RUNNER_TEMP/test.log" | head -20 | while IFS=: read -r n _; do
            echo "::error::$(sed -n "$n,$((n + 30))p" "$RUNNER_TEMP/test.log" | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, ""); gsub(/%/, "%25"); print substr($0, 1, 300) }')"
          done
  # Main's score, read by the Hive from this job's log instead of a run on its own machine, where
  # worker turns hold every project's turns behind "waiting: main's measure" (issue #127; hive's
  # .github/workflows/ci.yml score job): improve.ScoreJob is its name, improve.ScoreLine
  # ("hive-score: <number>") its last line. It runs the score command .hive/project.json names,
  # unchanged, with the test's tools, so the numbers match the Hive's own. A red here is no red
  # on main: the Hive then scores on its own machine.
  score:
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - name: the score (.hive/project.json's score command)
        shell: bash
        run: |
          cmd=$(python3 -c 'import json; print(json.load(open(".hive/project.json"))["score"]["command"])')
          bash -c "$cmd" 2>&1 | tee "$RUNNER_TEMP/score.log"
          test "${PIPESTATUS[0]}" = 0
          n=$(tail -n 1 "$RUNNER_TEMP/score.log" | awk '{ print $NF }')
          [[ "$n" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]
          echo "hive-score: $n"
        env:
          HIVE_TOOLS: ${{ runner.temp }}/tools
          HWDE_BIN: ${{ github.workspace }}/.ci/hive-hwde/bin/hwde
          HWDE_HOME: ${{ runner.temp }}/hwde
